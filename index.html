<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--A-->
<title>Voltio Finanças</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral fixa com troca Pessoal/Empresa; painel em grade de 12 colunas; um único bloco de cor (saldo em caixa) e o resto em superfícies calmas com fios finos. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F6F7FA; --line:#E0E5EE;
  --ink:#101A2E; --ink-2:#4A5672; --ink-3:#77829B;
  --accent-p:#2747E6; --accent-e:#0B7285; --on-accent:#FFFFFF; --spark:#F2C230;
  --pos:#0E8A62; --neg:#CF3B3B; --warn:#A96400;
  --pos-soft:#E0F4EB; --neg-soft:#FBE6E4; --warn-soft:#FAEED8;
  --shadow:0 18px 50px -20px rgba(16,26,46,.35);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0A101C; --surface:#121A2A; --surface-2:#182236; --line:#253150;
  --ink:#E9EEF8; --ink-2:#A9B4CB; --ink-3:#7783A0;
  --accent-p:#5173FF; --accent-e:#1492A8; --on-accent:#FFFFFF; --spark:#F2C230;
  --pos:#3CCB98; --neg:#FF7F77; --warn:#F0B14A;
  --pos-soft:#11302A; --neg-soft:#3A1C1F; --warn-soft:#3A2C12;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A101C; --surface:#121A2A; --surface-2:#182236; --line:#253150;
  --ink:#E9EEF8; --ink-2:#A9B4CB; --ink-3:#7783A0;
  --accent-p:#5173FF; --accent-e:#1492A8; --on-accent:#FFFFFF; --spark:#F2C230;
  --pos:#3CCB98; --neg:#FF7F77; --warn:#F0B14A;
  --pos-soft:#11302A; --neg-soft:#3A1C1F; --warn-soft:#3A2C12;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark }
:root{ --accent:var(--accent-p); padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px) }
:root[data-ws="empresa"]{ --accent:var(--accent-e) }

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--ink-3)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;align-self:start;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:22px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;transition:background .25s}
.brand-mark svg{width:18px;height:18px;fill:var(--spark)}
.brand b{font:700 19px/1 var(--display);letter-spacing:-.02em}
.brand span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.ws button{border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.ws button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--ink-3);padding:0 6px}
.main{min-width:0;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (min-width:901px){ .main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))} }

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.top h1{font:600 28px/1.1 var(--display);letter-spacing:-.025em;margin-right:auto;text-wrap:balance}
.top h1 small{display:block;font:500 13px/1.4 var(--body);letter-spacing:0;color:var(--ink-3);margin-top:4px}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px}
.stepper button{border:0;background:none;padding:8px 9px;display:grid;place-items:center;color:var(--ink-2);border-radius:10px}
.stepper button:hover{color:var(--accent)}
.stepper span{min-width:136px;text-align:center;font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:11px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.danger:hover{border-color:var(--neg);color:var(--neg)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;color:var(--ink-3);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:500}
.banner span{flex:1;min-width:200px}
.banner .btn{background:transparent;border-color:currentColor;color:inherit}

/* blocos */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1100px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}}
@media (max-width:640px){.c3,.c6{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h h2{font:600 16px/1.2 var(--display);letter-spacing:-.01em}
.card-h a,.link{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;padding:0}
.label{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hero{background:var(--accent);color:var(--on-accent);border-color:transparent;justify-content:space-between;position:relative;overflow:hidden;transition:background .25s}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:210px;height:210px;border-radius:50%;border:36px solid rgba(255,255,255,.08)}
.hero .label{color:rgba(255,255,255,.75)}
.hero .big{font:600 clamp(30px,4.2vw,42px)/1 var(--display);letter-spacing:-.03em;margin-top:8px}
.hero-foot{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:rgba(255,255,255,.85);position:relative;z-index:1}
.hero-foot b{display:block;font-size:15px;color:#fff}
.kpi .val{font:600 25px/1.1 var(--display);letter-spacing:-.02em}
.kpi{gap:8px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);align-self:flex-start}
.delta.good{background:var(--pos-soft);color:var(--pos)} .delta.bad{background:var(--neg-soft);color:var(--neg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:0;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)} .pill.late{background:var(--neg-soft);color:var(--neg)} .pill.wait{background:var(--warn-soft);color:var(--warn)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:14px}

/* gráficos */
.chart svg{width:100%;height:auto;display:block}
.chart text{font:500 11px var(--body);fill:var(--ink-3)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.donut{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.donut svg{width:150px;height:150px;flex:none}
.donut ul{list-style:none;margin:0;padding:0;flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.donut li{display:flex;align-items:center;gap:8px;font-size:13.5px}
.donut li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut li em{font-style:normal;color:var(--ink-3);font-size:12px;width:36px;text-align:right}

/* listas */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.row .v{font-weight:600;text-align:right;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.txrow{grid-template-columns:86px minmax(0,1.6fr) minmax(0,1fr) 108px 130px 68px}
.txhead{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-bottom:8px}
.txrow .acts{display:flex;justify-content:flex-end}
@media (max-width:760px){
  .txhead{display:none}
  .txrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d v" "c s" "a a"}
  .txrow>:nth-child(1){display:none}.txrow>:nth-child(2){grid-area:d}.txrow>:nth-child(3){grid-area:c}
  .txrow>:nth-child(4){grid-area:s;justify-self:end}.txrow>:nth-child(5){grid-area:v}.txrow>:nth-child(6){display:none}
}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters>*{flex:1 1 150px;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--neg)} .bar.done i{background:var(--pos)}
.budget{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:8px 14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.budget:first-child{border-top:0}
.budget .bar{grid-column:1/-1}
.goal .big{font:600 24px/1.1 var(--display);letter-spacing:-.02em}
.goal-acts{display:flex;gap:8px;flex-wrap:wrap}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.form .full{grid-column:1/-1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:11px;border:1px solid var(--line)}
.seg label{text-align:center;padding:7px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.result{background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px}
.result div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.result div.total{border-top:1px solid var(--line);padding-top:9px;margin-top:3px;font-weight:700;font-size:16px}
.result div.total b{font-family:var(--display);font-size:20px;color:var(--accent)}
.note{font-size:12.5px;color:var(--ink-3)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
tfoot td,tr.sum td{font-weight:700}
tr.sub td:first-child{padding-left:24px;color:var(--ink-2)}
td.mini{width:120px} td.mini .bar{min-width:90px}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:22px;width:min(540px,calc(100vw - 28px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,12,22,.55)}
dialog h2{font:600 20px/1.2 var(--display);letter-spacing:-.02em;margin-bottom:16px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{display:none}

@media (max-width:900px){
  .app{display:block}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  .side-foot,.brand span{display:none}
  .ws{margin-left:auto;min-width:176px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;gap:0;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav a{flex:1 0 auto;flex-direction:column;gap:3px;font-size:11px;padding:6px 11px}
  .main{padding-block:18px 150px}
  .top h1{font-size:24px;flex-basis:100%}
  .top .btn.primary{display:none}
  .fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);z-index:21}
  .fab svg.ic{width:24px;height:24px}
  .toast{bottom:calc(144px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!--B-->
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 9.8h-5.8z"/></svg></div>
      <div><b>Voltio</b><span>Finanças</span></div>
    </div>
    <div class="ws" role="group" aria-label="Perfil">
      <button type="button" data-act="ws" data-ws="pessoal">Pessoal</button>
      <button type="button" data-act="ws" data-ws="empresa">Empresa</button>
    </div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<button class="fab" type="button" data-act="new-tx" aria-label="Novo lançamento"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Math.abs(n) < 0.005 ? 0 : n).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const pct = n => (isFinite(n) ? n : 0).toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
const parseNum = s => {
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim().replace(/[R$%\s]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
const numIn = n => n ? n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:false}) : '';
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = iso(new Date());
const addMonth = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const dayIn = (k, day) => { const [y, m] = k.split('-').map(Number); return `${k}-${pad(Math.min(day, new Date(y, m, 0).getDate()))}`; };
const kDate = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1); };
const monthLabel = k => kDate(k).toLocaleDateString('pt-BR', {month:'long', year:'numeric'}).replace(/^./, c => c.toUpperCase());
const shortMonth = k => kDate(k).toLocaleDateString('pt-BR', {month:'short'}).replace('.', '');
const fmtDate = d => { const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y.slice(2)}`; };
const uid = () => Math.random().toString(36).slice(2, 10);
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const ICONS = {
  painel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  lancamentos:'<path d="M7 20V4M7 4 3 8M7 4l4 4M17 4v16M17 20l-4-4M17 20l4-4"/>',
  contas:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  orcamentos:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.2"/>',
  metas:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',

const T = (id, def) => ui.tools[id] ?? def;
const tIn = (id, label, def, extra = '') => `<div class="field"><label for="${id}">${label}</label><input type="text" inputmode="decimal" id="${id}" data-in="tool" value="${esc(T(id, def))}" ${extra}></div>`;
const res = rows => rows.map(([l, v, cls]) => `<div class="${cls || ''}"><span>${l}</span><b class="num">${v}</b></div>`).join('');
const TOOLS = {
  clt() {
    const b = parseNum(T('t-bruto', '6850')), dep = Math.round(parseNum(T('t-dep', '0'))), o = parseNum(T('t-outros', '0'));
    const i = inss(b), r = irrf(b, i, dep), fer = b * 4 / 3, fi = inss(fer), fr = irrf(fer, fi, dep);
    return res([['Salário bruto', brl(b)], ['INSS', '− ' + brl(i)], ['Imposto de renda (IRRF)', '− ' + brl(r)], ['Outros descontos', '− ' + brl(o)], ['Salário líquido', brl(b - i - r - o), 'total'],
      ['FGTS depositado pela empresa (8%)', brl(b * .08)], ['13º líquido (estimado)', brl(b - i - r)], ['Férias + 1/3 líquidas (estimado)', brl(fer - fi - fr)], ['Desconto total sobre o bruto', pct(b ? (i + r) / b * 100 : 0)]]);
  },
  simples() {
    const an = T('s-anexo', 'I'), rbt = parseNum(T('s-rbt', '540000')), fat = parseNum(T('s-fat', '45000')), tb = SIMPLES[an][1];
    if (rbt > 4800000) return `<div><span class="neg">Acima de R$ 4,8 milhões em 12 meses a empresa sai do Simples Nacional.</span></div>`;
    const fx = tb.find(f => rbt <= f[0]) || tb[5], ef = rbt > 0 ? (rbt * fx[1] / 100 - fx[2]) / rbt * 100 : tb[0][1];
    return res([['Faixa do Anexo ' + an, (tb.indexOf(fx) + 1) + 'ª faixa'], ['Alíquota nominal', pct(fx[1])], ['Parcela a deduzir', brl(fx[2])], ['Alíquota efetiva', (ef).toLocaleString('pt-BR', {maximumFractionDigits:2}) + '%'], ['DAS estimado do mês', brl(fat * ef / 100), 'total'], ['Fica na empresa após o DAS', brl(fat - fat * ef / 100)]]);
  },
  preco() {
    const c = parseNum(T('p-custo', '42')), im = parseNum(T('p-imp', '8')), va = parseNum(T('p-var', '6')), mg = parseNum(T('p-margem', '20')), fx = parseNum(T('p-fixos', '21000'));
    const div = 1 - (im + va + mg) / 100;
    if (div <= 0) return `<div><span class="neg">Impostos, despesas variáveis e margem somam 100% ou mais. Reduza algum percentual.</span></div>`;
    const p = c / div, mc = p - c - p * (im + va) / 100;
    return res([['Preço de venda sugerido', brl(p), 'total'], ['Markup sobre o custo', (c ? p / c : 0).toLocaleString('pt-BR', {maximumFractionDigits:2}) + '×'], ['Lucro por unidade', brl(p * mg / 100)], ['Margem de contribuição por unidade', brl(mc)],
      ['Ponto de equilíbrio', mc > 0 ? Math.ceil(fx / mc).toLocaleString('pt-BR') + ' unidades/mês' : '—'], ['Faturamento no ponto de equilíbrio', mc > 0 ? brl(Math.ceil(fx / mc) * p) : '—']]);
  }
};

V.relatorios = () => {

  const line = (l, f, cls = '', sign = '') => `<tr class="${cls}"><td>${l}</td><td class="num">${sign}${brl(f(m))}</td><td class="num muted">${mp(f(m), m)}</td><td class="num">${sign}${brl(f(a))}</td><td class="num muted">${mp(f(a), a)}</td></tr>`;

    <section class="card c7"><div class="card-h"><h2>Mês a mês em ${y}</h2><button class="link" data-act="export-csv">Exportar CSV</button></div><div class="scroll"><table><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Resultado</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr><td style="text-transform:capitalize">${kDate(r.k).toLocaleDateString('pt-BR', {month:'long'})}</td><td class="num">${r.in ? brl(r.in) : '—'}</td><td class="num">${r.out ? brl(r.out) : '—'}</td><td class="num ${r.net < 0 ? 'neg' : r.net > 0 ? 'pos' : 'muted'}">${r.in || r.out ? brl(r.net) : '—'}</td>

      <tfoot><tr><td>Total</td><td class="num">${brl(yt.in)}</td><td class="num">${brl(yt.out)}</td><td class="num ${yt.net < 0 ? 'neg' : 'pos'}">${brl(yt.net)}</td><td></td></tr></tfoot></table></div></section>

    <div class="field full"><label for="g-name">Nome da meta</label><input type="text" id="g-name" name="name" required maxlength="60" value="${esc(e.name)}" placeholder="Ex.: Reserva de emergência"></div>
    <div class="field"><label for="g-target">Valor alvo (R$)</label><input type="text" inputmode="decimal" id="g-target" name="target" required value="${numIn(e.target)}"></div>
    <div class="field"><label for="g-saved">Já guardado (R$)</label><input type="text" inputmode="decimal" id="g-saved" name="saved" value="${numIn(e.saved)}"></div>
    <div class="field full"><label for="g-deadline">Prazo (opcional)</label><input type="date" id="g-deadline" name="deadline" value="${e.deadline || ''}"></div></div>
    <div class="dlg-acts"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
}
function exportDlg(title, text, file, mime) {
  openDlg(`<h2>${title}</h2><textarea id="exp-text" rows="9" readonly style="font:12px/1.4 ui-monospace,monospace">${esc(text)}</textarea><p class="note" style="margin-top:8px">Se o download não iniciar neste ambiente, use “Copiar” e cole em um arquivo.</p>
    <div class="dlg-acts"><button class="btn" data-act="close">Fechar</button><button class="btn" id="exp-copy">Copiar</button><button class="btn primary" id="exp-dl">Baixar ${file}</button></div>`);
  $('#exp-copy').onclick = () => { const ta = $('#exp-text'); (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast('Copiado'), () => { ta.select(); toast('Selecionado. Pressione Ctrl+C para copiar'); }); };
  $('#exp-dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([mime.includes('csv') ? '﻿' : '', text], {type: mime})); a.download = file; document.body.append(a); a.click(); a.remove(); };
}
function csv() {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  return ['Data;Tipo;Descrição;Categoria;Valor;Situação'].concat([...W().tx].sort((a, b) => a.date.localeCompare(b.date)).map(x =>
    [fmtDate(x.date), x.type === 'in' ? 'Receita' : 'Despesa', q(x.desc), q(catInfo(x.cat).name), x.amount.toFixed(2).replace('.', ','), x.paid ? 'Quitado' : 'Pendente'].join(';'))).join('\n');
}

/* ---------- ações ---------- */
const find = id => W().tx.find(x => x.id === id), findG = id => W().goals.find(x => x.id === id);
const ACT = {
  ws: d => { S.ws = d.ws; ui.f.cat = ''; commit(); },
  month: d => { ui.month = addMonth(ui.month, +d.n); render(); },
  close: () => dlg.close(),
  'new-tx': () => txForm(), 'edit-tx': d => txForm(find(d.id)),
  'del-tx': d => ask('Excluir lançamento?', 'Esta ação não pode ser desfeita.', 'Excluir', () => { W().tx = W().tx.filter(x => x.id !== d.id); commit('Lançamento excluído'); }),
  'toggle-paid': d => { const x = find(d.id); x.paid = !x.paid; commit(x.paid ? (x.type === 'in' ? 'Marcado como recebido' : 'Marcado como pago') : 'Marcado como pendente'); },
  'new-goal': () => goalForm(), 'edit-goal': d => goalForm(findG(d.id)),
  'del-goal': d => ask('Excluir meta?', 'O valor guardado deixa de ser acompanhado.', 'Excluir', () => { W().goals = W().goals.filter(x => x.id !== d.id); commit('Meta excluída'); }),
  'goal-add': d => openDlg(`<form data-form="goal-add" data-id="${d.id}"><h2>Guardar na meta “${esc(findG(d.id).name)}”</h2><div class="field"><label for="ga-v">Valor (R$). Use negativo para retirar.</label><input type="text" inputmode="decimal" id="ga-v" name="v" required placeholder="0,00"></div><div class="dlg-acts"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary">Guardar</button></div></form>`),
  'export-csv': () => exportDlg('Exportar lançamentos (CSV)', csv(), `voltio-${S.ws}.csv`, 'text/csv;charset=utf-8'),
  'export-json': () => exportDlg('Backup completo', JSON.stringify(S), 'voltio-backup.json', 'application/json'),
  import: () => openDlg(`<form data-form="import"><h2>Restaurar backup</h2><div class="field"><label for="imp-file">Arquivo de backup (.json)</label><input type="file" id="imp-file" accept=".json,application/json"></div><div class="field" style="margin-top:12px"><label for="imp-text">ou cole o conteúdo aqui</label><textarea id="imp-text" name="text" rows="6"></textarea></div><p class="note" id="imp-err" style="color:var(--neg);margin-top:8px" hidden>Este conteúdo não é um backup válido do Voltio.</p><p class="note" style="margin-top:8px">Restaurar substitui todos os dados atuais.</p><div class="dlg-acts"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary">Restaurar</button></div></form>`),
  'load-demo': () => ask('Carregar dados de exemplo?', 'Os dados atuais dos dois perfis serão substituídos.', 'Substituir', () => { S.data = seed(); S.demo = true; commit('Exemplo carregado'); }),
  wipe: () => ask('Apagar tudo?', 'Todos os lançamentos, orçamentos e metas dos perfis Pessoal e Empresa serão removidos.', 'Apagar tudo', () => { S.data = {pessoal: blank(), empresa: blank()}; S.demo = false; commit('Pronto. Comece registrando seu primeiro lançamento'); })
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) { e.preventDefault(); ACT[b.dataset.act](b.dataset); } });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form; if (!kind) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), id = f.dataset.id;
  if (kind === 'tx') {
    const amount = Math.abs(parseNum(d.amount)); if (!(amount > 0)) { $('#tx-err').hidden = false; return; }
    const base = {type: d.type, desc: d.desc.trim(), amount, cat: d.cat, paid: !!d.paid};
    if (id) Object.assign(find(id), base, {date: d.date});
    else { const n = Math.min(36, Math.max(1, parseInt(d.rep) || 1)), day = +d.date.slice(8); for (let i = 0; i < n; i++) W().tx.push({...base, id: uid(), date: i ? dayIn(addMonth(d.date.slice(0, 7), i), day) : d.date, paid: i ? false : base.paid}); }
    dlg.close(); commit(id ? 'Lançamento atualizado' : 'Lançamento salvo');
  } else if (kind === 'goal') {
    const g = {name: d.name.trim(), target: Math.max(0.01, parseNum(d.target)), saved: Math.max(0, parseNum(d.saved)), deadline: d.deadline || ''};
    id ? Object.assign(findG(id), g) : W().goals.push({...g, id: uid()}); dlg.close(); commit('Meta salva');
  } else if (kind === 'goal-add') {
    const g = findG(id); g.saved = Math.max(0, g.saved + parseNum(d.v)); dlg.close(); commit('Valor registrado na meta');
  } else if (kind === 'import') {
    const done = txt => { try { const s = JSON.parse(txt); if (!s.data || !Array.isArray(s.data.pessoal?.tx) || !Array.isArray(s.data.empresa?.tx)) throw 0; S = s; applyTheme(); dlg.close(); commit('Backup restaurado'); } catch (err) { $('#imp-err').hidden = false; } };
    const file = $('#imp-file').files[0]; file ? file.text().then(done) : done(d.text);
  }
});
document.addEventListener('change', e => { const el = e.target;
  if (el.name === 'type' && el.form?.dataset.form === 'tx') { const c = $('#tx-cat'); c.innerHTML = el.value === 'in' ? c.dataset.inc : c.dataset.out; }
  if (el.dataset.in === 'budget') { const v = parseNum(el.value); v > 0 ? W().budgets[el.dataset.cat] = v : delete W().budgets[el.dataset.cat]; commit('Orçamento atualizado'); }
  if (el.dataset.in === 'opening') { W().opening = parseNum(el.value); save(); toast('Saldo inicial atualizado'); }
  if (el.dataset.in === 'theme') { S.theme = el.value; applyTheme(); save(); }
  if (el.dataset.in === 'user') { S.user = el.value.trim(); save(); toast('Nome salvo'); }
});
document.addEventListener('input', e => { const el = e.target;
  if (el.dataset.in === 'f') { ui.f[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; $('#txlist').innerHTML = txList(); }
  if (el.dataset.in === 'tool') { ui.tools[el.id] = el.value; for (const k in TOOLS) $('#r-' + k).innerHTML = TOOLS[k](); }
});
window.addEventListener('hashchange', route);
applyTheme(); route();
})();
</script>
</body>
</html>
